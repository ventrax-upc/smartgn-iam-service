# Activate only this profile in Render, never the local development profile.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 30000
server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoint:
    health:
      show-details: never
smartgn:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:}
    jwt:
      secret: ${JWT_SECRET}
